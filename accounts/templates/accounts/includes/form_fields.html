{% if form.errors %}
<div class="form-alert" role="alert">
  {% if form.non_field_errors %}{{ form.non_field_errors }}{% else %}入力内容をご確認ください。{% endif %}
</div>
{% endif %}
{% for field in form %}
<div class="form-field">
  {{ field.label_tag }}
  {{ field }}
  {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
{% endfor %}
